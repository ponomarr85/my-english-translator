
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My English Translator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 22px;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #292929;
}

.app { max-width: 650px; margin: auto; }

h2 { font-size: 21px; margin: 0 0 5px; }

.subtitle {
  color: #888;
  font-size: 13px;
  margin-bottom: 22px;
}

.languages {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

select {
  flex: 1;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 9px;
  background: white;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
  background: #35483d;
  color: white;
  cursor: pointer;
}

button.secondary {
  background: #f1f1ee;
  color: #333;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.swap { padding: 10px; }

textarea {
  width: 100%;
  min-height: 100px;
  resize: vertical;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  font: 16px/1.5 Arial;
}

.actions {
  display: flex;
  gap: 9px;
  margin: 12px 0 18px;
}

.result {
  min-height: 70px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  white-space: pre-wrap;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.placeholder { color: #aaa; }

.status {
  color: #888;
  font-size: 12px;
  margin: 10px 0;
}

.section {
  margin-top: 25px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

.section h3 {
  font-size: 17px;
  margin: 0 0 5px;
}

.section-description {
  font-size: 12px;
  color: #888;
  margin: 0 0 14px;
}

.word-heading {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 5px;
}

.word-phonetic {
  color: #888;
  font-size: 13px;
  margin-bottom: 12px;
}

.word-translation {
  font-size: 17px;
  margin-bottom: 16px;
}

.meaning {
  padding: 12px;
  background: #f8f8f6;
  border-radius: 10px;
  margin-top: 9px;
  font-size: 13px;
  line-height: 1.5;
}

.meaning strong {
  color: #35483d;
}

.example-card {
  padding: 13px;
  border: 1px solid #e7e5e1;
  border-radius: 11px;
  margin-top: 10px;
}

.example-number {
  color: #999;
  font-size: 11px;
  margin-bottom: 7px;
}

.example-en {
  font-size: 15px;
  line-height: 1.5;
  font-weight: 600;
}

.example-ru {
  color: #666;
  font-size: 14px;
  line-height: 1.5;
  margin-top: 6px;
}

.example-source {
  font-size: 11px;
  color: #999;
  margin-top: 8px;
}

.example-source a {
  color: #888;
}

.foot {
  font-size: 11px;
  color: #999;
  margin-top: 20px;
}
</style>
</head>

<body>
<div class="app">

<h2>My English Translator</h2>
<div class="subtitle">
A little helper for your English practice
</div>

<!-- LANGUAGE SELECTOR -->

<div class="languages">
  <select id="source">
    <option value="en">English</option>
    <option value="ru">Русский</option>
  </select>

  <button class="secondary swap" id="swap">⇄</button>

  <select id="target">
    <option value="ru">Русский</option>
    <option value="en">English</option>
  </select>
</div>

<textarea
  id="input"
  placeholder="Type a word or sentence..."
></textarea>

<div class="actions">
  <button id="translate">Translate text</button>
  <button class="secondary" id="clear">Clear</button>
</div>

<div class="status" id="status"></div>

<div class="result placeholder" id="output">
Your translation will appear here...
</div>

<div class="actions">
  <button class="secondary" id="copy">Copy translation</button>
</div>

<!-- WORD DICTIONARY -->

<div class="section">

<h3>Word dictionary</h3>

<p class="section-description">
Translation, pronunciation and real usage examples
</p>

<button id="lookupWord">
Find meaning & examples
</button>

<div id="dictionaryResult" style="margin-top:15px;">
  <div class="result placeholder">
    Enter one English or Russian word to explore it.
  </div>
</div>

</div>

<div class="foot">
Translation: MyMemory · Dictionary: Free Dictionary API ·
Examples: Tatoeba
</div>

</div>

<script>

const input = document.getElementById("input");
const output = document.getElementById("output");
const status = document.getElementById("status");
const dictionaryResult = document.getElementById("dictionaryResult");

function isRussian(text) {
  return /[а-яё]/i.test(text);
}

function decodeHTML(text) {
  const el = document.createElement("textarea");
  el.innerHTML = text;
  return el.value;
}

// TRANSLATION FUNCTION

async function translateText(text, source, target) {

  const params = new URLSearchParams({
    q: text,
    langpair: source + "|" + target
  });

  const response = await fetch(
    "https://api.mymemory.translated.net/get?" + params
  );

  if (!response.ok) {
    throw new Error("Translation service unavailable.");
  }

  const data = await response.json();

  if (data.responseStatus !== 200) {
    throw new Error(data.responseDetails || "Translation failed.");
  }

  return decodeHTML(data.responseData.translatedText);
}

// SWAP LANGUAGES

document.getElementById("swap").onclick = () => {
  const source = document.getElementById("source");
  const target = document.getElementById("target");

  const old = source.value;
  source.value = target.value;
  target.value = old;
};

// CLEAR

document.getElementById("clear").onclick = () => {
  input.value = "";

  output.textContent = "Your translation will appear here...";
  output.classList.add("placeholder");

  dictionaryResult.innerHTML =
    '<div class="result placeholder">Enter one English or Russian word to explore it.</div>';

  status.textContent = "";
};

// COPY

document.getElementById("copy").onclick = async () => {
  if (output.classList.contains("placeholder")) return;

  try {
    await navigator.clipboard.writeText(output.textContent);
    status.textContent = "Copied!";
  } catch {
    status.textContent = "Please select and copy the text.";
  }
};

// TRANSLATE SENTENCES

document.getElementById("translate").onclick = async () => {

  const text = input.value.trim();
  const source = document.getElementById("source").value;
  const target = document.getElementById("target").value;

  if (!text) {
    status.textContent = "Enter some text first.";
    return;
  }

  if (source === target) {
    status.textContent = "Choose different languages.";
    return;
  }

  const button = document.getElementById("translate");

  button.disabled = true;
  status.textContent = "Translating...";

  try {

    const translation = await translateText(
      text,
      source,
      target
    );

    output.textContent = translation;
    output.classList.remove("placeholder");

    status.textContent = "Done!";

  } catch (error) {

    status.textContent = error.message;

  } finally {

    button.disabled = false;

  }
};

// TATOEBA EXAMPLES

async function getTatoebaExamples(word) {

  const params = new URLSearchParams();

  params.set("lang", "eng");
  params.set("q", "=" + word);
  params.set("trans:lang", "rus");
  params.set("showtrans", "all");
  params.set("limit", "10");

  const response = await fetch(
    "https://api.tatoeba.org/v1/sentences?" + params
  );

  if (!response.ok) {
    throw new Error("Examples service unavailable.");
  }

  const data = await response.json();

  const sentences =
    data.data || data.sentences || data.results || [];

  function findRussianTranslations(item) {

    const found = [];

    function walk(value) {

      if (!value) return;

      if (Array.isArray(value)) {
        value.forEach(walk);
        return;
      }

      if (typeof value !== "object") return;

      if (
        typeof value.text === "string" &&
        ["rus", "ru"].includes(value.lang)
      ) {
        found.push(value);
      }

      Object.values(value).forEach(walk);
    }

    walk(item.translations || []);

    return [...new Map(
      found.map(x => [x.text, x])
    ).values()];
  }

  return sentences
    .map(item => ({
      id: item.id,
      english: item.text,
      translations: findRussianTranslations(item)
    }))
    .filter(item =>
      item.english &&
      item.translations.length > 0
    )
    .slice(0, 5);
}

// DICTIONARY LOOKUP

document.getElementById("lookupWord").onclick = async () => {

  const originalWord = input.value.trim();

  if (!originalWord || /\s/.test(originalWord)) {
    dictionaryResult.textContent =
      "Please enter one word, not a sentence.";
    return;
  }

  const button = document.getElementById("lookupWord");

  button.disabled = true;

  dictionaryResult.textContent =
    "Finding translation and examples...";

  try {

    // DETECT LANGUAGE

    const russian = isRussian(originalWord);

    // GET ENGLISH WORD

    const englishWord = russian
      ? await translateText(originalWord, "ru", "en")
      : originalWord;

    const cleanWord = englishWord
      .trim()
      .replace(/[.,!?;:]+$/, "");

    if (!/^[a-zA-Z'-]+$/.test(cleanWord)) {
      throw new Error("Could not identify an English word.");
    }

    // GET RUSSIAN TRANSLATION

    const russianWord = russian
      ? originalWord
      : await translateText(cleanWord, "en", "ru");

    // GET DICTIONARY AND EXAMPLES

    const dictionaryPromise = fetch(
      "https://api.dictionaryapi.dev/api/v2/entries/en/" +
      encodeURIComponent(cleanWord.toLowerCase())
    );

    const examplesPromise = getTatoebaExamples(
      cleanWord.toLowerCase()
    );

    const [dictionaryResponse, examples] = await Promise.all([
      dictionaryPromise,
      examplesPromise
    ]);

    let dictionary = null;

    if (dictionaryResponse.ok) {
      const data = await dictionaryResponse.json();
      dictionary = data[0];
    }

    // BUILD RESULT

    dictionaryResult.replaceChildren();

    const heading = document.createElement("div");
    heading.className = "word-heading";
    heading.textContent = cleanWord;

    dictionaryResult.appendChild(heading);

    const translation = document.createElement("div");
    translation.className = "word-translation";
    translation.textContent = russianWord;

    dictionaryResult.appendChild(translation);

    if (dictionary) {

      const phonetic =
        dictionary.phonetic ||
        dictionary.phonetics?.find(p => p.text)?.text ||
        "";

      if (phonetic) {
        const pronunciation = document.createElement("div");
        pronunciation.className = "word-phonetic";
        pronunciation.textContent = "Pronunciation: " + phonetic;
        dictionaryResult.appendChild(pronunciation);
      }

      for (const meaning of dictionary.meanings || []) {

        const card = document.createElement("div");
        card.className = "meaning";

        const part = document.createElement("strong");
        part.textContent = meaning.partOfSpeech.toUpperCase();

        card.appendChild(part);

        const definitions = (meaning.definitions || []).slice(0, 2);

        for (const definition of definitions) {

          const description = document.createElement("p");
          description.textContent = definition.definition;
          card.appendChild(description);

        }

        dictionaryResult.appendChild(card);
      }
    }

    // SHOW REAL EXAMPLES WITH TRANSLATIONS

    const examplesTitle = document.createElement("h3");
    examplesTitle.textContent = "Examples in context";
    examplesTitle.style.marginTop = "25px";

    dictionaryResult.appendChild(examplesTitle);

    if (examples.length) {

      examples.forEach((example, index) => {

        const card = document.createElement("div");
        card.className = "example-card";

        const number = document.createElement("div");
        number.className = "example-number";
        number.textContent = "EXAMPLE " + (index + 1);

        const english = document.createElement("div");
        english.className = "example-en";
        english.textContent = example.english;

        const russianTranslation = document.createElement("div");
        russianTranslation.className = "example-ru";
        russianTranslation.textContent =
          example.translations[0].text;

        const source = document.createElement("div");
        source.className = "example-source";

        const link = document.createElement("a");
        link.href =
          "https://tatoeba.org/en/sentences/show/" + example.id;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Source: Tatoeba";

        source.appendChild(link);

        card.append(
          number,
          english,
          russianTranslation,
          source
        );

        dictionaryResult.appendChild(card);

      });

    } else {

      const message = document.createElement("p");
      message.textContent =
        "No matching bilingual examples found. Try another word.";

      dictionaryResult.appendChild(message);

    }

  } catch (error) {

    dictionaryResult.textContent =
      "Could not load the word. " + error.message;

  } finally {

    button.disabled = false;

  }

};

</script>
</body>
</html>
